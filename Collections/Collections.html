<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanduran - Collections</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="collections.css">
</head>
<body>

  <section class="collections" id="products">
    <div class="collections-top">
      <h2>Choose your desired from our collections</h2>
      <div class="collections-right">
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit, sed do eiusmod</p>
        <a href="#" class="btn small-btn">View More</a>
      </div>
    </div>

    <div class="cards">
      <div class="card">
        <div class="card-image plant-1"></div>
        <div class="card-info">
          <span>Calathea Orbifolia</span>
          <span>$30.00</span>
        </div>
      </div>

      <div class="card">
        <div class="card-image plant-2"></div>
        <div class="card-info">
          <span>Grafted Ficus Bonsai</span>
          <span>$50.00</span>
        </div>
      </div>

      <div class="card">
        <div class="card-image plant-3"></div>
        <div class="card-info">
          <span>Hawaiian Umbrella Tree</span>
          <span>$15.00</span>
        </div>
      </div>

      <div class="card">
        <div class="card-image plant-4"></div>
        <div class="card-info">
          <span>Prayer Plant</span>
          <span>$25.00</span>
        </div>
      </div>
    </div>

</html>
